<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>GG Love Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one centered phone-sized "card table": a big question card on top, four answer tiles below, a pass-the-phone curtain between turns. */
:root{
  --bg:#F7EEF6; --bg2:#EFDDEB; --card:#FFFFFF; --ink:#2B1530; --muted:#7A5C7E;
  --cherry:#E2335E; --cherry-ink:#FFFFFF; --tang:#FF9640; --line:#E6CFE0; --good:#1E9E6A; --miss:#B4567A;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B0F1F; --bg2:#2A1730; --card:#2B1A31; --ink:#F7E9F5; --muted:#C2A2C3;
  --cherry:#FF5A80; --cherry-ink:#24071A; --tang:#FFAA5E; --line:#45294D; --good:#4CD69B; --miss:#E58AAE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B0F1F; --bg2:#2A1730; --card:#2B1A31; --ink:#F7E9F5; --muted:#C2A2C3;
  --cherry:#FF5A80; --cherry-ink:#24071A; --tang:#FFAA5E; --line:#45294D; --good:#4CD69B; --miss:#E58AAE; color-scheme:dark}
html,body{height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg) 70%);background-color:var(--bg);color:var(--ink);font:500 16px/1.45 var(--body);padding:0 16px;}
.wrap{max-width:460px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:18px;min-height:100%;box-sizing:border-box}
h1,h2,.disp{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
.logo{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo .gg{font-family:var(--display);font-size:26px;color:var(--cherry);line-height:1}
.logo .gg small{color:var(--ink);font-size:15px;margin-left:6px}
.score{font-weight:800;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.score b{color:var(--cherry);font-size:18px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:0 10px 30px -18px rgba(120,20,70,.45)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--cherry) 14%,transparent);color:var(--cherry)}
.q{font-family:var(--display);font-size:clamp(24px,6.6vw,30px);line-height:1.15;margin:12px 0 6px;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;margin:0}
.answers{display:grid;gap:10px}
.ans{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:700;font-size:17px;cursor:pointer;transition:transform .12s,border-color .12s}
.ans:hover{border-color:var(--cherry)}
.ans:active{transform:scale(.98)}
.ans:focus-visible{outline:3px solid var(--tang);outline-offset:2px}
.ans .k{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--bg2);font-family:var(--display);color:var(--cherry);font-size:16px}
.ans.pick-a{border-color:var(--cherry);background:color-mix(in srgb,var(--cherry) 10%,var(--card))}
.ans.pick-b{border-color:var(--tang);background:color-mix(in srgb,var(--tang) 12%,var(--card))}
.ans.pick-a.pick-b{background:linear-gradient(100deg,color-mix(in srgb,var(--cherry) 14%,var(--card)),color-mix(in srgb,var(--tang) 16%,var(--card)))}
.ans .who{margin-left:auto;display:flex;gap:4px}
.dot{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;color:var(--cherry-ink)}
.dot.a{background:var(--cherry)} .dot.b{background:var(--tang);color:#2B1530}
.btn{all:unset;box-sizing:border-box;text-align:center;font-family:var(--display);font-size:20px;padding:15px 22px;border-radius:18px;background:var(--cherry);color:var(--cherry-ink);cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--cherry) 55%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--cherry) 55%,#000)}
.btn:focus-visible{outline:3px solid var(--tang);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-family:var(--body);font-weight:800;font-size:16px;padding:12px 18px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
label{font-weight:800;font-size:14px;display:block;margin-bottom:6px}
input[type=text]{width:100%;box-sizing:border-box;font:700 17px var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
input[type=text]:focus{outline:none;border-color:var(--cherry)}
.vibes{display:flex;flex-wrap:wrap;gap:8px}
.vibe{all:unset;cursor:pointer;font-weight:800;font-size:15px;padding:9px 14px;border-radius:99px;border:2px solid var(--line);background:var(--card)}
.vibe[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vibe:focus-visible{outline:3px solid var(--tang);outline-offset:2px}
.curtain{min-height:62vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.curtain .big{font-family:var(--display);font-size:clamp(36px,11vw,52px);line-height:1.05;color:var(--cherry)}
.result{text-align:center;padding:6px 0}
.result .big{font-family:var(--display);font-size:34px;line-height:1.1}
.result.match .big{color:var(--good)} .result.miss .big{color:var(--miss)}
.final{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.meter{font-family:var(--display);font-size:84px;line-height:1;color:var(--cherry);font-variant-numeric:tabular-nums}
.bar{width:100%;height:14px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cherry),var(--tang));border-radius:99px;transition:width .8s}
.progress{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--cherry);transition:width .3s}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;font-size:26px;color:var(--cherry);animation:up 2.2s ease-in forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.small{font-size:13px;color:var(--muted)}
.ai{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:auto;text-align:center;font-size:13px;color:var(--muted)}
.linkish{all:unset;cursor:pointer;text-decoration:underline;color:var(--muted);font-weight:700}
.btn.alt{background:var(--tang);color:#2B1530;box-shadow:0 6px 0 color-mix(in srgb,var(--tang) 55%,#000)}
.net{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-top:-8px}
.ndot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.ndot.on{background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.ndot.off{background:var(--miss)}
.qrbox{background:#fff;border-radius:18px;padding:10px;width:min(230px,70vw);margin:0 auto;line-height:0}
.qrbox svg{width:100%;height:auto;display:block}
.linkbox{font:700 13px var(--body);word-break:break-all;color:var(--muted);text-align:center;user-select:all}
.seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.status{text-align:center;font-weight:800;color:var(--muted);padding:4px 0}
.status b{color:var(--ink)}
.typing::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const VIBES = {cute:"Cute", funny:"Funny", deep:"Deep", spicy:"Spicy", pick:"This or that", who:"Who's more likely"};
// t: "a" = about one person ({S} answers for real, {O} guesses) · "u" = both answer for yourselves · "w" = who-is-more-likely
const Q = [
 // cute
 {c:"cute",t:"a",q:"What's {S}'s love language?",a:["Sweet words","Quality time","Hugs & touch","Little favours"]},
 {c:"cute",t:"a",q:"What does {S} miss most when you're apart?",a:["Cuddles","Talking all night","Eating together","Just being in the same room"]},
 {c:"cute",t:"u",q:"The perfect lazy Sunday together?",a:["Bed + movies all day","Long brunch out","A day trip somewhere new","Cooking together at home"]},
 {c:"cute",t:"a",q:"What gift would make {S} happiest?",a:["Something handmade","A trip","Jewellery or clothes","A surprise dinner"]},
 {c:"cute",t:"u",q:"Best kind of date?",a:["Fancy dinner","Sunset picnic","Arcade or bowling","Night walk by the sea"]},
 {c:"cute",t:"a",q:"How does {S} like to be comforted?",a:["A long hug","Talking it out","Some space first","Food. Always food"]},
 {c:"cute",t:"u",q:"Where's our dream house?",a:["By the sea","In the mountains","City centre","A quiet village"]},
 {c:"cute",t:"a",q:"How does {S} say \"I love you\" without words?",a:["A look","Making food","A random cute text","Holding hands"]},
 {c:"cute",t:"u",q:"Our future pet?",a:["Dog","Cat","Something weird (parrot? lizard?)","No pets, thanks"]},
 {c:"cute",t:"a",q:"What did {S} notice first about {O}?",a:["The eyes","The smile","The voice","The style"]},
 {c:"cute",t:"u",q:"Our song should be…",a:["A slow romantic one","One we scream in the car","Whatever played when we met","We don't need one"]},
 {c:"cute",t:"a",q:"{S}'s favourite memory of us is probably…",a:["Our first date","A trip together","A silly random night","Something very recent"]},
 // funny
 {c:"funny",t:"a",q:"What would {S} do first with 1 million €?",a:["Travel the world","Buy a house","Quit the job","Food & shopping spree"]},
 {c:"funny",t:"a",q:"{S}'s worst habit?",a:["Always on the phone","Always late","Leaves stuff everywhere","Gets hangry"]},
 {c:"funny",t:"a",q:"{S}'s karaoke song would be…",a:["A cheesy love ballad","A rap they don't know the words to","A Greek or Italian classic","They'd never sing"]},
 {c:"funny",t:"a",q:"If {S} were an animal?",a:["A sleepy cat","A golden retriever","A clever fox","A grumpy owl"]},
 {c:"funny",t:"a",q:"{S}'s go-to midnight snack?",a:["Something sweet","Chips","Leftovers straight from the fridge","Toast or a sandwich"]},
 {c:"funny",t:"a",q:"{S}'s daily phone screen time?",a:["Under 2 hours","2–4 hours","4–6 hours","We don't talk about it"]},
 {c:"funny",t:"a",q:"Which superpower would {S} pick?",a:["Teleport","Read minds","Fly","Stop time"]},
 {c:"funny",t:"a",q:"When {S} gets a cold, {S} is…",a:["Brave, totally normal","A tiny dramatic baby","Hiding it","Googling every symptom"]},
 {c:"funny",t:"a",q:"In a horror movie, {S} would…",a:["Die first","Survive to the end","Secretly be the killer","Make jokes the whole time"]},
 {c:"funny",t:"a",q:"What annoys {S} the most?",a:["Slow walkers","Loud chewing","Being interrupted","People who are late"]},
 {c:"funny",t:"u",q:"Pineapple on pizza?",a:["Yes, love it","Absolutely not","Only if it's free","Never tried it"]},
 {c:"funny",t:"a",q:"{S} would be famous for…",a:["Cooking","Being a drama queen/king","An embarrassing viral video","Accidentally inventing something"]},
 // deep
 {c:"deep",t:"a",q:"What worries {S} most about the future?",a:["Money","Health","Not being happy","Losing people they love"]},
 {c:"deep",t:"a",q:"What makes {S} feel most loved?",a:["Being really listened to","Little surprises","Being chosen first","Being held"]},
 {c:"deep",t:"u",q:"Most important thing in a relationship?",a:["Trust","Fun","Communication","Passion"]},
 {c:"deep",t:"a",q:"Where does {S} see themselves in 5 years?",a:["Same city, more settled","Living abroad","Running their own thing","No idea, day by day"]},
 {c:"deep",t:"u",q:"Best way to end a fight?",a:["Talk it out right away","Cool down first","Hug first, talk later","Food and a joke"]},
 {c:"deep",t:"a",q:"If {S} could change one thing in the past…",a:["Nothing at all","A study or work choice","A friendship","Take more risks"]},
 {c:"deep",t:"a",q:"What does {S} need after a bad day?",a:["Silence","To vent","A distraction","A cuddle"]},
 {c:"deep",t:"u",q:"Kids someday?",a:["Yes, more than one","Maybe one","Not sure yet","No"]},
 {c:"deep",t:"a",q:"What is {S} most proud of?",a:["Their work","Their people","Who they've become","A secret achievement"]},
 {c:"deep",t:"u",q:"What matters most in life?",a:["Adventure","Stability","Freedom","Love & family"]},
 {c:"deep",t:"a",q:"With one free year, {S} would…",a:["Travel","Learn something new","Rest. Just rest","Start a project"]},
 {c:"deep",t:"u",q:"Money when living together?",a:["Split everything 50/50","Whoever earns more pays more","One shared pot","Each pays their own"]},
 // spicy (mild)
 {c:"spicy",t:"a",q:"{S}'s favourite place to be kissed?",a:["Lips","Neck","Forehead","Hands"]},
 {c:"spicy",t:"a",q:"When does {S} think {O} looks best?",a:["Just woke up","Dressed up for a night out","After the gym","While laughing"]},
 {c:"spicy",t:"u",q:"Best time for romance?",a:["Morning","Lazy afternoon","Late night","Anytime"]},
 {c:"spicy",t:"a",q:"What does {S} find most attractive about {O}?",a:["The smile","The eyes","The confidence","The humour"]},
 {c:"spicy",t:"a",q:"{S}'s ideal romantic surprise?",a:["Candles & dinner at home","A hotel night","A love letter","A spontaneous trip"]},
 {c:"spicy",t:"u",q:"Our first kiss gets…",a:["10/10, movie scene","Cute but awkward","Nervous mess","Wait… remind me?"]},
 {c:"spicy",t:"a",q:"What gives {S} butterflies?",a:["A long look","A surprise kiss","Hearing \"I miss you\"","Holding hands in public"]},
 {c:"spicy",t:"u",q:"The best kind of flirty text?",a:["Sweet","Funny memes","Voice notes","Bold ones"]},
 {c:"spicy",t:"a",q:"What would {S} like {O} to wear tonight?",a:["Something elegant","Comfy pyjamas","Sporty","Less is more"]},
 // this or that
 {c:"pick",t:"u",q:"Dream trip together?",a:["Japan","Italian road trip","Maldives","Iceland northern lights"]},
 {c:"pick",t:"u",q:"Dinner tonight?",a:["Sushi","Souvlaki","Pizza","Burger"]},
 {c:"pick",t:"u",q:"Weekend plan?",a:["Party all night","Netflix + blanket","Hiking","Seeing friends"]},
 {c:"pick",t:"u",q:"Movie night genre?",a:["Rom-com","Horror","Action","Animated"]},
 {c:"pick",t:"u",q:"Time machine: where do we go?",a:["Meet our future selves","Relive our first date","Ancient Greece","Ancient Rome"]},
 {c:"pick",t:"u",q:"Our wedding style?",a:["Huge party, everyone invited","Small and cozy","Elope abroad","On a beach"]},
 {c:"pick",t:"u",q:"Breakfast?",a:["Pancakes","Eggs","Just coffee","Croissant on the go"]},
 {c:"pick",t:"u",q:"If we opened a business together?",a:["A café","A beach bar","An online shop","A travel agency"]},
 {c:"pick",t:"u",q:"Our season?",a:["Summer","Winter","Spring","Autumn"]},
 {c:"pick",t:"u",q:"A shared superpower for the two of us?",a:["Teleport anywhere","Unlimited money","Never get tired","Speak every language"]},
 // who's more likely
 ...[
  "get us lost","cry at a movie","fall asleep first during a film","eat the last slice","apologise first",
  "forget an anniversary","survive a zombie apocalypse","spend too much money","take longer to get ready",
  "say \"I love you\" more","be the better cook","plan the next date","get jealous","dance in public",
  "steal the blanket","text first after a fight","scream at a spider","be grumpy in the morning",
  "laugh at their own joke","win a board game","start a tickle fight","order for both of us"
 ].map(x=>({c:"who",t:"w",q:"Who's more likely to "+x+"?",a:["{A}","{B}","Both of us","Neither"]}))
];

const LS = "gg-love-game";
const store = {get(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}}, set(v){try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){}}};
const saved = store.get();

let S = {
  screen:"intro", a:saved.a||"Gioia", b:saved.b||"Gerasimos",
  vibes: saved.vibes||["cute","funny","deep","spicy","pick","who"], rounds: saved.rounds||12,
  deck:[], i:0, first:0, pickA:null, pickB:null, phase:"a", matches:0, history:[], extra:[]
};

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const h = (html) => { app.innerHTML = html; };

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

// whose turn: p 0 = player A, 1 = player B. Round i: first picker alternates.
const nameOf = p => p===0 ? S.a : S.b;
function cur(){ return S.deck[S.i]; }
function firstP(i=S.i){ return i % 2; }
function fill(text, i=S.i){
  const subj = nameOf(firstP(i)), oth = nameOf(1-firstP(i));
  return text.replaceAll("{S}",subj).replaceAll("{O}",oth).replaceAll("{A}",S.a).replaceAll("{B}",S.b);
}
function hint(q, i=S.i){
  const subj = nameOf(firstP(i)), oth = nameOf(1-firstP(i));
  if(q.t==="a") return `${subj} answers for real · ${oth} guesses`;
  if(q.t==="w") return "Both answer. Same pick = point";
  return "Both answer for yourselves. Same pick = point";
}

function header(){
  const live = (S.screen==="live"||S.screen==="liveend") && N && N.game;
  let right;
  if(live) right = `<b>${N.game.matches}</b> / ${N.game.done} in sync`;
  else if(S.screen==="play"||S.screen==="end") right = `<b>${S.matches}</b> / ${S.history.length} in sync`;
  else right = `${esc(S.a)} &amp; ${esc(S.b)}`;
  let bar = "";
  if(S.screen==="play") bar = `<div class="progress" aria-hidden="true"><i style="width:${(S.i/S.deck.length*100).toFixed(1)}%"></i></div>`;
  if(live && S.screen==="live") bar = `<div class="progress" aria-hidden="true"><i style="width:${(N.game.i/N.game.deck.length*100).toFixed(1)}%"></i></div>`;
  let net = "";
  if(N && N.me!=null && ["lobby","live","liveend","livesetup","livewait"].includes(S.screen)){
    const other = 1-N.me, on = !!N.online[other];
    net = `<div class="net"><span class="ndot ${N.connected?(on?"on":""):"off"}"></span>${!N.connected?"Connecting…":on?`${esc(nameOf(other))} is here`:`Waiting for ${esc(nameOf(other))}`}
      <span style="margin-left:auto">You: <b>${esc(nameOf(N.me))}</b></span></div>`;
  }
  return `<div class="logo"><div class="gg">GG<small>love game</small></div>
  <div class="score">${right}</div></div>${net}${bar}`;
}

function render(){
  if(S.screen==="intro") return renderIntro();
  if(S.screen==="setup") return renderSetup();
  if(S.screen==="play") return renderPlay();
  if(S.screen==="end") return renderEnd();
  if(S.screen==="lobby") return renderLobby();
  if(S.screen==="joinwait") return renderJoinWait();
  if(S.screen==="joinhello") return renderJoinHello();
  if(S.screen==="live") return renderLive();
  if(S.screen==="liveend") return renderLiveEnd();
  if(S.screen==="livesetup") return renderSetup();
  if(S.screen==="livewait") return renderLiveWait();
}

function renderIntro(){
  h(`${header()}
  <div class="curtain">
    <div class="eyebrow">A little surprise for</div>
    <div class="big">${esc(S.a)}</div>
    <p style="font-size:18px;max-width:30ch;margin:0">${esc(S.b)} made you a game. Let's see how well you two really know each other.</p>
    <button class="btn" id="go">Let's play ♥</button>
  </div>
  <div class="foot">How to play: pick an answer secretly, pass the phone, reveal. Same answer = a point.</div>`);
  document.getElementById("go").onclick = ()=>{ S.screen="setup"; hearts(10); render(); };
}

function renderSetup(){
  h(`${header()}
  <div class="card" style="display:flex;flex-direction:column;gap:16px">
    <h2 style="font-size:26px">Who's playing?</h2>
    <div class="row">
      <div><label for="na">Player 1</label><input type="text" id="na" value="${esc(S.a)}" maxlength="18"></div>
      <div><label for="nb">Player 2</label><input type="text" id="nb" value="${esc(S.b)}" maxlength="18"></div>
    </div>
    <div><label>Vibes</label><div class="vibes" id="vibes">${Object.entries(VIBES).map(([k,v])=>`<button class="vibe" data-k="${k}" aria-pressed="${S.vibes.includes(k)}">${v}</button>`).join("")}</div></div>
    <div><label>Questions</label><div class="vibes" id="rounds">${[8,12,20,0].map(n=>`<button class="vibe" data-n="${n}" aria-pressed="${S.rounds===n}">${n||"All"}</button>`).join("")}</div></div>
    <div class="small" id="count"></div>
    ${S.screen==="livesetup" ? `<button class="btn" id="start3">Start new game</button>
    <div class="small" style="text-align:center;margin-top:-6px">Starts on both phones.</div>` : `<button class="btn" id="start">Play on one phone</button>
    <button class="btn alt" id="start2">Play on two phones</button>
    <div class="small" style="text-align:center;margin-top:-6px">Two phones: each answers on their own phone, both see the reveal live.</div>`}
  </div>
  ${S.screen==="livesetup" ? `<div class="foot"><button class="linkish" id="back">Back</button></div>` : ""}
  <div class="card ai" id="aibox" hidden>
    <div class="eyebrow">Fresh questions</div>

    <button class="btn ghost" id="gen">Write new questions</button>
    <div class="small" id="aimsg" role="status"></div>
  </div>`);
  const upd = ()=>{ document.getElementById("count").textContent = pool().length+" questions in these vibes"+(S.extra.length?` (incl. ${S.extra.length} new from Claude)`:""); };
  upd();
  document.getElementById("vibes").onclick = e=>{const k=e.target.dataset.k;if(!k)return;
    S.vibes = S.vibes.includes(k)? S.vibes.filter(x=>x!==k) : [...S.vibes,k];
    if(!S.vibes.length) S.vibes=[k];
    document.querySelectorAll("#vibes .vibe").forEach(b=>b.setAttribute("aria-pressed",S.vibes.includes(b.dataset.k))); upd(); };
  document.getElementById("rounds").onclick = e=>{const n=e.target.dataset.n;if(n===undefined)return;S.rounds=+n;
    document.querySelectorAll("#rounds .vibe").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.n===S.rounds));};
  if(S.screen==="livesetup"){
    document.getElementById("start3").onclick = ()=>{
      S.a = document.getElementById("na").value.trim()||"Player 1";
      S.b = document.getElementById("nb").value.trim()||"Player 2";
      store.set({a:S.a,b:S.b,vibes:S.vibes,rounds:S.rounds});
      pubGame(newGame(N.game.host)); window.scrollTo(0,0);
    };
    document.getElementById("back").onclick = ()=>pubGame({...N.game, picking:null});
    return;
  }
  document.getElementById("start").onclick = start;
  document.getElementById("start2").onclick = hostLive;
  setupAI();
}

function pool(){ return [...S.extra, ...Q].filter(q=>S.vibes.includes(q.c)); }

function start(){
  S.a = document.getElementById("na").value.trim()||"Player 1";
  S.b = document.getElementById("nb").value.trim()||"Player 2";
  store.set({a:S.a,b:S.b,vibes:S.vibes,rounds:S.rounds});
  const fresh = S.extra.filter(q=>S.vibes.includes(q.c));
  let deck = [...shuffle(fresh), ...shuffle(Q.filter(q=>S.vibes.includes(q.c)))];
  if(S.rounds) deck = deck.slice(0,S.rounds);
  S.deck = shuffle(deck); S.i=0; S.matches=0; S.history=[]; S.pickA=S.pickB=null; S.phase="first";
  S.screen="play"; render();
}

function renderPlay(){
  const q = cur(); const fp = firstP(); const picker = S.phase==="first"? fp : 1-fp;
  if(S.phase==="pass"){
    h(`${header()}<div class="curtain">
      <div class="eyebrow">No peeking</div>
      <div class="big">Pass the phone to ${esc(nameOf(1-fp))}</div>
      <p class="hint">${esc(nameOf(fp))} has picked. Your turn.</p>
      <button class="btn" id="ready">I'm ${esc(nameOf(1-fp))}, ready</button></div>`);
    document.getElementById("ready").onclick=()=>{S.phase="second";render();};
    return;
  }
  const reveal = S.phase==="reveal";
  const match = reveal && S.pickA===S.pickB;
  h(`${header()}
  <div class="card">
    <span class="chip">${VIBES[q.c]||"Bonus"}</span>
    <div class="q">${esc(fill(q.q))}</div>
    <p class="hint">${reveal? esc(hint(q)) : `<b style="color:var(--ink)">${esc(nameOf(picker))}</b>, pick secretly · ${esc(hint(q))}`}</p>
  </div>
  <div class="answers" id="ans">${q.a.map((t,k)=>{
     const ca = reveal && S.pickA===k, cb = reveal && S.pickB===k;
     return `<button class="ans ${ca?"pick-a":""} ${cb?"pick-b":""}" data-k="${k}" ${reveal?'tabindex="-1"':""}>
       <span class="k">${"ABCD"[k]}</span><span>${esc(fill(t))}</span>
       ${reveal&&(ca||cb)?`<span class="who">${ca?`<span class="dot a">${esc(nameOf(fp))}</span>`:""}${cb?`<span class="dot b">${esc(nameOf(1-fp))}</span>`:""}</span>`:""}
     </button>`;}).join("")}</div>
  ${reveal?`<div class="result ${match?"match":"miss"}"><div class="big">${match?"In sync! ♥":"Oops, not this time"}</div>
     <p class="hint">${match? (q.t==="a"?`${esc(nameOf(1-fp))} knows ${esc(nameOf(fp))} well.`:"Same wavelength.") : (q.t==="a"?`${esc(nameOf(fp))}, tell ${esc(nameOf(1-fp))} why!`:"Talk it out. Who's right?")}</p></div>
     <button class="btn" id="next">${S.i+1<S.deck.length?"Next question":"See our score"}</button>`:""}`);
  if(!reveal){
    document.getElementById("ans").onclick = e=>{
      const b = e.target.closest(".ans"); if(!b) return; const k=+b.dataset.k;
      if(S.phase==="first"){ S.pickA=k; S.phase="pass"; }
      else { S.pickB=k; S.phase="reveal";
        const m = S.pickA===S.pickB; if(m){S.matches++; hearts(14);}
        S.history.push({q:fill(q.q),m}); }
      render(); window.scrollTo(0,0);
    };
  } else {
    document.getElementById("next").onclick = ()=>{
      S.i++; S.pickA=S.pickB=null; S.phase="first";
      if(S.i>=S.deck.length) S.screen="end"; render(); window.scrollTo(0,0);
    };
  }
}

function verdict(p){
  if(p>=85) return ["Soulmates","Basically one brain in two bodies."];
  if(p>=65) return ["Perfect match","You know each other really well."];
  if(p>=45) return ["Sweet chaos","Lots in common, plenty left to discover."];
  if(p>=25) return ["Opposites attract","Different answers, more to talk about tonight."];
  return ["Mystery lovers","Time for a long date to fix this."];
}

function renderEnd(){
  const n=S.history.length, p = n? Math.round(S.matches/n*100) : 0; const [t,sub]=verdict(p);
  h(`${header()}
  <div class="card final">
    <div class="eyebrow">${esc(S.a)} &amp; ${esc(S.b)} are</div>
    <div class="meter">${p}%</div>
    <div class="bar"><i style="width:${p}%"></i></div>
    <h2 style="font-size:30px;color:var(--cherry)">${t}</h2>
    <p class="hint" style="font-size:16px">${sub} ${S.matches} of ${n} answers matched.</p>
    <div class="row" style="width:100%"><button class="btn" id="again">New game</button></div>
  </div>`);
  if(p>=45) hearts(24);
  document.getElementById("again").onclick=()=>{ S.screen="setup"; render(); window.scrollTo(0,0); };
}

function hearts(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box=document.getElementById("hearts");
  for(let i=0;i<n;i++){const s=document.createElement("span");s.textContent="♥";
    s.style.left=Math.random()*100+"%";s.style.animationDelay=(Math.random()*.7)+"s";s.style.fontSize=(16+Math.random()*22)+"px";
    box.appendChild(s);setTimeout(()=>s.remove(),3200);}
}

// Optional: Claude writes new questions (only where this viewer can use Claude)
let samplePromise = window.claude?.use ? window.claude.use("sample").catch(()=>null) : Promise.resolve(null);
async function setupAI(){
  const sample = await samplePromise; const box=document.getElementById("aibox"); if(!sample||!box) return;
  box.hidden=false;
  const btn=document.getElementById("gen"), msg=document.getElementById("aimsg");
  btn.onclick = async ()=>{
    btn.disabled=true; msg.textContent="Claude is thinking up questions…";
    const vibes = S.vibes.map(k=>VIBES[k]).join(", ");
    const prompt = `Write 10 new, original questions for a couples quiz game played by ${S.a} and ${S.b}. Vibes to use (spread across them): ${vibes}. Keep "Spicy" flirty but mild, never explicit.
Each question has exactly 4 short answers (max 6 words each). Avoid these existing questions: ${Q.slice(0,40).map(q=>q.q).join(" | ")}.
Types: "a" = a question about one person, written with {S} for that person and {O} for the partner (e.g. "What would {S} order at 3am?"); "u" = both answer for themselves (e.g. "Our dream holiday?"); "w" = "Who's more likely to ...?" with answers exactly ["{A}","{B}","Both of us","Neither"].
Vibe keys: cute, funny, deep, spicy, pick (for This or that), who (for Who's more likely).
Reply with only a JSON array like [{"c":"funny","t":"a","q":"...","a":["...","...","...","..."]}].`;
    try{
      const arr = await sample.json(prompt,{cache:false});
      const ok = (Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.q==="string"&&Array.isArray(x.a)&&x.a.length===4&&VIBES[x.c]&&["a","u","w"].includes(x.t))
        .map(x=>({c:x.c,t:x.t,q:String(x.q).slice(0,140),a:x.a.map(s=>String(s).slice(0,60))}));
      S.extra = [...ok, ...S.extra];
      msg.textContent = ok.length? `Added ${ok.length} new questions. They come first in your next game.` : "That didn't work. Try again.";
      const c=document.getElementById("count"); if(c) c.textContent = pool().length+` questions in these vibes (incl. ${S.extra.length} new from Claude)`;
    }catch(e){
      if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code)){ box.hidden=true; return; }
      msg.textContent = e?.code==="rate_limited" ? "Too many requests. Try again in a minute." : "That didn't work. Try again.";
    }finally{ btn.disabled=false; }
  };
}

// ---------- Two phones, live ----------
// Each game is a "room" on a free public message relay. Shared state lives in retained messages:
//   game      {g, a, b, host, vibes, rounds, deck:[Q index], i, matches, done}
//   pick/<p>  {g, i, k}      (p 0 = player 1, 1 = player 2)
//   online/<p>{on}
const BROKER = "wss://broker.hivemq.com:8884/mqtt";
let N = null;
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), x => "abcdefghjkmnpqrstuvwxyz23456789"[x % 31]).join("");
const liveLink = () => location.origin + location.pathname + "?room=" + N.room;
const roomKey = r => "ggl-room-" + r;

function connect(room, me){
  const keep = N && N.room===room ? N.game : null;
  N = {room, me, game:keep, picks:{}, online:{}, client:null, connected:false, base:"ggl/"+room+"/", t0:Date.now(), hearted:""};
  if(typeof mqtt==="undefined"){ N.failed = true; return; }
  const opts = {clientId:"ggl_"+rid(10), clean:true, reconnectPeriod:2000, connectTimeout:10000};
  if(me!=null) opts.will = {topic:N.base+"online/"+me, payload:JSON.stringify({on:false}), retain:true, qos:0};
  const c = mqtt.connect(BROKER, opts), mine = N;
  N.client = c;
  c.on("connect", ()=>{ if(N!==mine) return; N.connected = true; c.subscribe(N.base+"#", {qos:1});
    if(N.me!=null) pub("online/"+N.me, {on:true}); render(); });
  c.on("close", ()=>{ if(N!==mine || !N.connected) return; N.connected = false; render(); });
  c.on("message", (t, buf)=>{
    if(N!==mine) return;
    let m; try{ m = JSON.parse(buf.toString()); }catch(e){ return; }
    const k = t.slice(N.base.length);
    if(k==="game"){ if(!m || !Array.isArray(m.deck)) return; N.game = m; S.a = m.a; S.b = m.b; }
    else if(k.startsWith("pick/")) N.picks[+k.slice(5)] = m;
    else if(k.startsWith("online/")) N.online[+k.slice(7)] = !!(m && m.on);
    else return;
    onLive();
  });
}
function pub(k, obj){ N && N.client && N.client.publish(N.base+k, JSON.stringify(obj), {retain:true, qos:1}); }
function pubGame(G){ N.game = G; pub("game", G); onLive(); }
function pickOf(p){ const G = N.game, x = N.picks[p]; return G && x && x.g===G.g && x.i===G.i ? x.k : null; }

function onLive(){
  const G = N.game;
  if(S.screen==="joinwait" && G) S.screen = "joinhello";
  if(S.screen==="lobby" && G && N.online[1-N.me]) S.screen = "live";
  const was = S.screen;
  if(G && ["live","liveend","livesetup","livewait"].includes(S.screen)){
    if(G.picking!=null) S.screen = G.picking===N.me ? "livesetup" : "livewait";
    else S.screen = G.i>=G.deck.length ? "liveend" : "live";
  }
  if(S.screen==="livesetup" && was==="livesetup") return; // don't wipe what is being typed
  render();
}

function renderLiveWait(){
  const who = nameOf(N.game.picking);
  h(`${header()}<div class="curtain">
    <div class="eyebrow">New game</div>
    <div class="big" style="font-size:34px">${esc(who)} is choosing the vibes<span class="typing"></span></div>
    <p class="hint">The next game starts here by itself.</p>
    <button class="linkish" id="me">Let me choose instead</button>
  </div>
  <div class="foot"><button class="linkish" id="leave">Leave game</button></div>`);
  document.getElementById("me").onclick = ()=>pubGame({...N.game, picking:N.me});
  document.getElementById("leave").onclick = leaveLive;
}

function makeDeck(){
  const idx = Q.map((q,i)=>i).filter(i=>S.vibes.includes(Q[i].c));
  let d = shuffle(idx); if(S.rounds) d = d.slice(0, S.rounds); return d;
}
function newGame(host){ return {g:rid(6), a:S.a, b:S.b, host, vibes:S.vibes, rounds:S.rounds, deck:makeDeck(), i:0, matches:0, done:0}; }

function hostLive(){
  S.a = document.getElementById("na").value.trim()||"Player 1";
  S.b = document.getElementById("nb").value.trim()||"Player 2";
  store.set({a:S.a,b:S.b,vibes:S.vibes,rounds:S.rounds});
  const room = rid(6), me = 1;
  try{ localStorage.setItem(roomKey(room), me); }catch(e){}
  history.replaceState(null, "", "?room="+room);
  connect(room, me);
  pubGame(newGame(me));
  S.screen = "lobby"; render();
}

function setMe(me){
  const old = N.me;
  if(old!=null && old!==me) pub("online/"+old, {on:false});
  try{ localStorage.setItem(roomKey(N.room), me); }catch(e){}
  const c = N.client, G = N.game, room = N.room;
  if(c) setTimeout(()=>c.end(), 300);
  connect(room, me);
  if(G && G.host!==undefined && S.screen==="lobby"){ pubGame({...G, host:me}); }
}

function leaveLive(){
  if(N){ if(N.me!=null) pub("online/"+N.me, {on:false}); const c = N.client; if(c) setTimeout(()=>c.end(), 300); }
  N = null; history.replaceState(null, "", location.pathname);
  S.screen = "setup"; render();
}

function qrSvg(t){

}

function renderLive(){
  const G = N.game;
  if(!G){ h(`${header()}<div class="curtain"><div class="big" style="font-size:30px">Loading<span class="typing"></span></div></div>`); return; }
  const i = G.i, q = Q[G.deck[i]], fp = firstP(i), other = 1-N.me;
  const mine = pickOf(N.me), theirs = pickOf(other);
  const reveal = mine!==null && theirs!==null;
  const pA = pickOf(fp), pB = pickOf(1-fp), match = reveal && pA===pB;
  const key = G.g+":"+i;
  if(reveal && match && N.hearted!==key){ N.hearted = key; hearts(14); }
  let status = "";
  if(!reveal){
    if(mine===null) status = theirs!==null ? `<b>${esc(nameOf(other))}</b> has answered ✓ · your turn` : `Both pick now · <b>${esc(nameOf(other))}</b> is thinking<span class="typing"></span>`;
    else status = `Locked in ✓ · waiting for <b>${esc(nameOf(other))}</b><span class="typing"></span>`;
  }
  h(`${header()}
  <div class="card">
    <span class="chip">${VIBES[q.c]||"Bonus"}</span>
    <div class="q">${esc(fill(q.q, i))}</div>
    <p class="hint">${esc(hint(q, i))}</p>
  </div>
  <div class="answers" id="ans">${q.a.map((t,k)=>{
     const ca = reveal ? pA===k : mine===k && N.me===fp, cb = reveal ? pB===k : mine===k && N.me!==fp;
     return `<button class="ans ${ca?"pick-a":""} ${cb?"pick-b":""}" data-k="${k}" ${mine!==null?'tabindex="-1"':""}>
       <span class="k">${"ABCD"[k]}</span><span>${esc(fill(t, i))}</span>
       ${(ca||cb)?`<span class="who">${ca?`<span class="dot a">${esc(reveal?nameOf(fp):"You")}</span>`:""}${cb?`<span class="dot b">${esc(reveal?nameOf(1-fp):"You")}</span>`:""}</span>`:""}
     </button>`;}).join("")}</div>
  ${reveal?`<div class="result ${match?"match":"miss"}"><div class="big">${match?"In sync! ♥":"Oops, not this time"}</div>
     <p class="hint">${match? (q.t==="a"?`${esc(nameOf(1-fp))} knows ${esc(nameOf(fp))} well.`:"Same wavelength.") : (q.t==="a"?`${esc(nameOf(fp))}, tell ${esc(nameOf(1-fp))} why!`:"Talk it out. Who's right?")}</p></div>
     <button class="btn" id="next">${i+1<G.deck.length?"Next question":"See our score"}</button>`
   : `<div class="status">${status}</div>`}
  <div class="foot"><button class="linkish" id="leave">Leave game</button></div>`);
  if(mine===null){
    document.getElementById("ans").onclick = e=>{
      const b = e.target.closest(".ans"); if(!b) return;
      N.picks[N.me] = {g:G.g, i, k:+b.dataset.k}; pub("pick/"+N.me, N.picks[N.me]); onLive();
    };
  }
  if(reveal){
    document.getElementById("next").onclick = ()=>{
      const cur = N.game; if(cur.g!==G.g || cur.i!==i) return;
      pubGame({...cur, i:i+1, matches:cur.matches+(match?1:0), done:cur.done+1}); window.scrollTo(0,0);
    };
  }
  document.getElementById("leave").onclick = leaveLive;
}

function renderLiveEnd(){
  const G = N.game, n = G.done, p = n ? Math.round(G.matches/n*100) : 0, [t,sub] = verdict(p);
  h(`${header()}
  <div class="card final">
    <div class="eyebrow">${esc(S.a)} &amp; ${esc(S.b)} are</div>
    <div class="meter">${p}%</div>
    <div class="bar"><i style="width:${p}%"></i></div>

  </div>`);

  document.getElementById("again").onclick = ()=>{ S.vibes = G.vibes||S.vibes; S.rounds = G.rounds??S.rounds; pubGame({...G, picking:N.me}); window.scrollTo(0,0); };
  document.getElementById("leave").onclick = leaveLive;
}

function boot(){
  const room = new URLSearchParams(location.search).get("room");
  if(room && /^[a-z0-9]{4,12}$/.test(room)){
    let me = null; try{ const v = localStorage.getItem(roomKey(room)); if(v==="0"||v==="1") me = +v; }catch(e){}
    connect(room, me);
    S.screen = me===null ? "joinwait" : "live";
  }
  render();
}
boot();
</script>
