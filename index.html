<style>
/* Layout: one centered phone-sized "card table": a big question card on top, four answer tiles below, a pass-the-phone curtain between turns. */
:root{
  --bg:#F7EEF6; --bg2:#EFDDEB; --card:#FFFFFF; --ink:#2B1530; --muted:#7A5C7E;
  --cherry:#E2335E; --cherry-ink:#FFFFFF; --tang:#FF9640; --line:#E6CFE0; --good:#1E9E6A; --miss:#B4567A;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B0F1F; --bg2:#2A1730; --card:#2B1A31; --ink:#F7E9F5; --muted:#C2A2C3;
  --cherry:#FF5A80; --cherry-ink:#24071A; --tang:#FFAA5E; --line:#45294D; --good:#4CD69B; --miss:#E58AAE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B0F1F; --bg2:#2A1730; --card:#2B1A31; --ink:#F7E9F5; --muted:#C2A2C3;
  --cherry:#FF5A80; --cherry-ink:#24071A; --tang:#FFAA5E; --line:#45294D; --good:#4CD69B; --miss:#E58AAE; color-scheme:dark}
html,body{height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg) 70%);background-color:var(--bg);color:var(--ink);font:500 16px/1.45 var(--body);padding:0 16px;}
.wrap{max-width:460px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:18px;min-height:100%;box-sizing:border-box}
h1,h2,.disp{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
.logo{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo .gg{font-family:var(--display);font-size:26px;color:var(--cherry);line-height:1}
.logo .gg small{color:var(--ink);font-size:15px;margin-left:6px}
.score{font-weight:800;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.score b{color:var(--cherry);font-size:18px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:0 10px 30px -18px rgba(120,20,70,.45)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--cherry) 14%,transparent);color:var(--cherry)}
.q{font-family:var(--display);font-size:clamp(24px,6.6vw,30px);line-height:1.15;margin:12px 0 6px;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;margin:0}
.answers{display:grid;gap:10px}
.ans{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:700;font-size:17px;cursor:pointer;transition:transform .12s,border-color .12s}
.ans:hover{border-color:var(--cherry)}
.ans:active{transform:scale(.98)}
.ans:focus-visible{outline:3px solid var(--tang);outline-offset:2px}
.ans .k{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--bg2);font-family:var(--display);color:var(--cherry);font-size:16px}
.ans.pick-a{border-color:var(--cherry);background:color-mix(in srgb,var(--cherry) 10%,var(--card))}
.ans.pick-b{border-color:var(--tang);background:color-mix(in srgb,var(--tang) 12%,var(--card))}
.ans.pick-a.pick-b{background:linear-gradient(100deg,color-mix(in srgb,var(--cherry) 14%,var(--card)),color-mix(in srgb,var(--tang) 16%,var(--card)))}
.ans .who{margin-left:auto;display:flex;gap:4px}
.dot{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;color:var(--cherry-ink)}
.dot.a{background:var(--cherry)} .dot.b{background:var(--tang);color:#2B1530}
.btn{all:unset;box-sizing:border-box;text-align:center;font-family:var(--display);font-size:20px;padding:15px 22px;border-radius:18px;background:var(--cherry);color:var(--cherry-ink);cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--cherry) 55%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--cherry) 55%,#000)}
.btn:focus-visible{outline:3px solid var(--tang);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-family:var(--body);font-weight:800;font-size:16px;padding:12px 18px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
label{font-weight:800;font-size:14px;display:block;margin-bottom:6px}
input[type=text]{width:100%;box-sizing:border-box;font:700 17px var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
input[type=text]:focus{outline:none;border-color:var(--cherry)}
.vibes{display:flex;flex-wrap:wrap;gap:8px}
.vibe{all:unset;cursor:pointer;font-weight:800;font-size:15px;padding:9px 14px;border-radius:99px;border:2px solid var(--line);background:var(--card)}
.vibe[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vibe:focus-visible{outline:3px solid var(--tang);outline-offset:2px}
.curtain{min-height:62vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.curtain .big{font-family:var(--display);font-size:clamp(36px,11vw,52px);line-height:1.05;color:var(--cherry)}
.result{text-align:center;padding:6px 0}
.result .big{font-family:var(--display);font-size:34px;line-height:1.1}
.result.match .big{color:var(--good)} .result.miss .big{color:var(--miss)}
.final{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.meter{font-family:var(--display);font-size:84px;line-height:1;color:var(--cherry);font-variant-numeric:tabular-nums}
.bar{width:100%;height:14px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cherry),var(--tang));border-radius:99px;transition:width .8s}
.progress{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--cherry);transition:width .3s}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;font-size:26px;color:var(--cherry);animation:up 2.2s ease-in forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.small{font-size:13px;color:var(--muted)}
.ai{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:auto;text-align:center;font-size:13px;color:var(--muted)}
.linkish{all:unset;cursor:pointer;text-decoration:underline;color:var(--muted);font-weight:700}
.btn.alt{background:var(--tang);color:#2B1530;box-shadow:0 6px 0 color-mix(in srgb,var(--tang) 55%,#000)}
.net{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-top:-8px}
.ndot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.ndot.on{background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.ndot.off{background:var(--miss)}
.qrbox{background:#fff;border-radius:18px;padding:10px;width:min(230px,70vw);margin:0 auto;line-height:0}
.qrbox svg{width:100%;height:auto;display:block}
.linkbox{font:700 13px var(--body);word-break:break-all;color:var(--muted);text-align:center;user-select:all}
.seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.status{text-align:center;font-weight:800;color:var(--muted);padding:4px 0}
.status b{color:var(--ink)}
.typing::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.kitty{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px}
.kpic{width:min(170px,46vw);aspect-ratio:1;max-width:100%;border-radius:28px;overflow:hidden;display:grid;place-items:center;background:var(--bg2);border:3px solid var(--card);box-shadow:0 10px 26px -14px rgba(120,20,70,.6)}
.kpic img{width:100%;height:100%;object-fit:cover;display:block}
.kpic svg{width:88%;height:88%;overflow:visible}
.kbar{width:min(260px,80%);height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
.kbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cherry),var(--tang));animation-name:kfill;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes kfill{to{width:100%}}
.k-bounce{animation:kb .7s ease-in-out infinite alternate}
@keyframes kb{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.k-wiggle{animation:kw .5s ease-in-out infinite alternate}
@keyframes kw{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.k-pop{animation:kp 1s cubic-bezier(.3,1.6,.5,1) both,kpulse 1.2s ease-in-out 1s infinite alternate}
@keyframes kp{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes kpulse{to{transform:scale(1.06)}}
.k-float{animation:kf 2.4s ease-in-out infinite}
@keyframes kf{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(0,-10px) rotate(3deg)}}
.k-spin{animation:ks 1.1s cubic-bezier(.3,1.4,.5,1) both}
@keyframes ks{from{transform:rotate(-360deg) scale(.3)}to{transform:none}}
.k-jelly{animation:kj 1s ease-in-out infinite}
@keyframes kj{0%,100%{transform:scale(1,1)}30%{transform:scale(1.12,.88)}60%{transform:scale(.92,1.08)}}
.kpic .blink{transform-box:fill-box;transform-origin:center;animation:kblink 3.2s infinite}
@keyframes kblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.kpic .tail{transform-box:fill-box;transform-origin:0% 100%;animation:kwag .6s ease-in-out infinite alternate}
@keyframes kwag{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

 ].map(x=>({c:"who",t:"w",q:"Who's more likely to "+x+"?",a:["{A}","{B}","Both of us","Neither"]}))
];

const LS = "gg-love-game";
const store = {get(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}}, set(v){try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){}}};
const saved = store.get();

let S = {
  screen:"intro", a:saved.a||"Gioia", b:saved.b||"Gerasimos",
  vibes: saved.vibes||["cute","funny","deep","spicy","pick","who"], rounds: saved.rounds||12,
  deck:[], i:0, first:0, pickA:null, pickB:null, phase:"a", matches:0, history:[], extra:[]
};

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const h = (html) => { app.innerHTML = html; };

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

// whose turn: p 0 = player A, 1 = player B. Round i: first picker alternates.
const nameOf = p => p===0 ? S.a : S.b;
function cur(){ return S.deck[S.i]; }
function firstP(i=S.i){ return i % 2; }
function fill(text, i=S.i){
  const subj = nameOf(firstP(i)), oth = nameOf(1-firstP(i));
  return text.replaceAll("{S}",subj).replaceAll("{O}",oth).replaceAll("{A}",S.a).replaceAll("{B}",S.b);
}
function hint(q, i=S.i){
  const subj = nameOf(firstP(i)), oth = nameOf(1-firstP(i));
  if(q.t==="a") return `${subj} answers for real · ${oth} guesses`;
  if(q.t==="w") return "Both answer. Same pick = point";
  return "Both answer for yourselves. Same pick = point";
}

function header(){
  const live = (S.screen==="live"||S.screen==="liveend") && N && N.game;
  let right;
  if(live) right = `<b>${N.game.matches}</b> / ${N.game.done} in sync`;
  else if(S.screen==="play"||S.screen==="end") right = `<b>${S.matches}</b> / ${S.history.length} in sync`;
  else right = `${esc(S.a)} &amp; ${esc(S.b)}`;
  let bar = "";
  if(S.screen==="play") bar = `<div class="progress" aria-hidden="true"><i style="width:${(S.i/S.deck.length*100).toFixed(1)}%"></i></div>`;
  if(live && S.screen==="live") bar = `<div class="progress" aria-hidden="true"><i style="width:${(N.game.i/N.game.deck.length*100).toFixed(1)}%"></i></div>`;
  let net = "";
  if(N && N.me!=null && ["lobby","live","liveend","livesetup","livewait"].includes(S.screen)){
    const other = 1-N.me, on = !!N.online[other];
    net = `<div class="net"><span class="ndot ${N.connected?(on?"on":""):"off"}"></span>${!N.connected?"Connecting…":on?`${esc(nameOf(other))} is here`:`Waiting for ${esc(nameOf(other))}`}
      <span style="margin-left:auto">You: <b>${esc(nameOf(N.me))}</b></span></div>`;
  }
  return `<div class="logo"><div class="gg">GG<small>love game</small></div>
  <div class="score">${right}</div></div>${net}${bar}`;
}

function render(){
  if(S.screen==="intro") return renderIntro();
  if(S.screen==="setup") return renderSetup();
  if(S.screen==="play") return renderPlay();
  if(S.screen==="end") return renderEnd();
  if(S.screen==="lobby") return renderLobby();
  if(S.screen==="joinwait") return renderJoinWait();
  if(S.screen==="joinhello") return renderJoinHello();
  if(S.screen==="live") return renderLive();
  if(S.screen==="liveend") return renderLiveEnd();
  if(S.screen==="livesetup") return renderSetup();
  if(S.screen==="livewait") return renderLiveWait();
}

function pool(){ return [...S.extra, ...Q].filter(q=>S.vibes.includes(q.c)); }

function start(){
  S.a = document.getElementById("na").value.trim()||"Player 1";
  S.b = document.getElementById("nb").value.trim()||"Player 2";
  store.set({a:S.a,b:S.b,vibes:S.vibes,rounds:S.rounds});
  const fresh = S.extra.filter(q=>S.vibes.includes(q.c));
  let deck = [...shuffle(fresh), ...shuffle(Q.filter(q=>S.vibes.includes(q.c)))];
  if(S.rounds) deck = deck.slice(0,S.rounds);
  S.deck = shuffle(deck); S.i=0; S.matches=0; S.history=[]; S.pickA=S.pickB=null; S.phase="first";
  S.screen="play"; render();
}

function renderPlay(){
  const q = cur(); const fp = firstP(); const picker = S.phase==="first"? fp : 1-fp;
  if(S.phase==="pass"){
    h(`${header()}<div class="curtain">

  h(`${header()}

       <span class="k">${"ABCD"[k]}</span><span>${esc(fill(t))}</span>
       ${reveal&&(ca||cb)?`<span class="who">${ca?`<span class="dot a">${esc(nameOf(fp))}</span>`:""}${cb?`<span class="dot b">${esc(nameOf(1-fp))}</span>`:""}</span>`:""}
     </button>`;}).join("")}</div>
  ${reveal?`<div class="result ${match?"match":"miss"}"><div class="big">${match?"In sync! ♥":"Oops, not this time"}</div>
     <p class="hint">${match? (q.t==="a"?`${esc(nameOf(1-fp))} knows ${esc(nameOf(fp))} well.`:"Same wavelength.") : (q.t==="a"?`${esc(nameOf(fp))}, tell ${esc(nameOf(1-fp))} why!`:"Talk it out. Who's right?")}</p></div>
     ${kittyHTML(S.auto, S.i+1<S.deck.length?"Next question coming…":"Your score is coming…")}`:""}`);
  if(!reveal){

// ---------- Two phones, live ----------
// Each game is a "room" on a free public message relay. Shared state lives in retained messages:
//   game      {g, a, b, host, vibes, rounds, deck:[Q index], i, matches, done}
//   pick/<p>  {g, i, k}      (p 0 = player 1, 1 = player 2)
//   online/<p>{on}
const BROKER = "wss://broker.hivemq.com:8884/mqtt";
let N = null;
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), x => "abcdefghjkmnpqrstuvwxyz23456789"[x % 31]).join("");
const liveLink = () => location.origin + location.pathname + "?room=" + N.room;
const roomKey = r => "ggl-room-" + r;

function connect(room, me){
  const keep = N && N.room===room ? N.game : null;
  N = {room, me, game:keep, picks:{}, online:{}, client:null, connected:false, base:"ggl/"+room+"/", t0:Date.now(), hearted:""};
  if(typeof mqtt==="undefined"){ N.failed = true; return; }
  const opts = {clientId:"ggl_"+rid(10), clean:true, reconnectPeriod:2000, connectTimeout:10000};
  if(me!=null) opts.will = {topic:N.base+"online/"+me, payload:JSON.stringify({on:false}), retain:true, qos:0};
  const c = mqtt.connect(BROKER, opts), mine = N;
  N.client = c;
  c.on("connect", ()=>{ if(N!==mine) return; N.connected = true; c.subscribe(N.base+"#", {qos:1});
    if(N.me!=null) pub("online/"+N.me, {on:true}); render(); });
  c.on("close", ()=>{ if(N!==mine || !N.connected) return; N.connected = false; render(); });
  c.on("message", (t, buf)=>{
    if(N!==mine) return;
    let m; try{ m = JSON.parse(buf.toString()); }catch(e){ return; }
    const k = t.slice(N.base.length);
    if(k==="game"){ if(!m || !Array.isArray(m.deck)) return; N.game = m; S.a = m.a; S.b = m.b; }
    else if(k.startsWith("pick/")) N.picks[+k.slice(5)] = m;
    else if(k.startsWith("online/")) N.online[+k.slice(7)] = !!(m && m.on);
    else return;
    onLive();
  });
}
function pub(k, obj){ N && N.client && N.client.publish(N.base+k, JSON.stringify(obj), {retain:true, qos:1}); }
function pubGame(G){ N.game = G; pub("game", G); onLive(); }
function pickOf(p){ const G = N.game, x = N.picks[p]; return G && x && x.g===G.g && x.i===G.i ? x.k : null; }

function onLive(){
  const G = N.game;
  if(S.screen==="joinwait" && G) S.screen = "joinhello";
  if(S.screen==="lobby" && G && N.online[1-N.me]) S.screen = "live";
  const was = S.screen;
  if(G && ["live","liveend","livesetup","livewait"].includes(S.screen)){
    if(G.picking!=null) S.screen = G.picking===N.me ? "livesetup" : "livewait";
    else S.screen = G.i>=G.deck.length ? "liveend" : "live";
  }
  if(S.screen==="livesetup" && was==="livesetup") return; // don't wipe what is being typed
  render();
}

function renderLiveWait(){
  const who = nameOf(N.game.picking);
  h(`${header()}<div class="curtain">
    <div class="eyebrow">New game</div>
    <div class="big" style="font-size:34px">${esc(who)} is choosing the vibes<span class="typing"></span></div>
    <p class="hint">The next game starts here by itself.</p>
    <button class="linkish" id="me">Let me choose instead</button>
  </div>
  <div class="foot"><button class="linkish" id="leave">Leave game</button></div>`);
  document.getElementById("me").onclick = ()=>pubGame({...N.game, picking:N.me});
  document.getElementById("leave").onclick = leaveLive;

function makeDeck(){
  const idx = Q.map((q,i)=>i).filter(i=>S.vibes.includes(Q[i].c));
  let d = shuffle(idx); if(S.rounds) d = d.slice(0, S.rounds); return d;
}
function newGame(host){ return {g:rid(6), a:S.a, b:S.b, host, vibes:S.vibes, rounds:S.rounds, deck:makeDeck(), i:0, matches:0, done:0}; }

function hostLive(){
  S.a = document.getElementById("na").value.trim()||"Player 1";
  S.b = document.getElementById("nb").value.trim()||"Player 2";
  store.set({a:S.a,b:S.b,vibes:S.vibes,rounds:S.rounds});
  const room = rid(6), me = 1;
  try{ localStorage.setItem(roomKey(room), me); }catch(e){}
  history.replaceState(null, "", "?room="+room);
  connect(room, me);
  pubGame(newGame(me));
  S.screen = "lobby"; render();
}

function setMe(me){
  const old = N.me;
  if(old!=null && old!==me) pub("online/"+old, {on:false});
  try{ localStorage.setItem(roomKey(N.room), me); }catch(e){}
  const c = N.client, G = N.game, room = N.room;
  if(c) setTimeout(()=>c.end(), 300);
  connect(room, me);
  if(G && G.host!==undefined && S.screen==="lobby"){ pubGame({...G, host:me}); }
}

function leaveLive(){
  if(N){ if(N.me!=null) pub("online/"+N.me, {on:false}); const c = N.client; if(c) setTimeout(()=>c.end(), 300); }
  N = null; history.replaceState(null, "", location.pathname);
  S.screen = "setup"; render();
}

function qrSvg(t){
  try{ const q = qrcode(0, "M"); q.addData(t); q.make(); return q.createSvgTag({cellSize:6, margin:2, scalable:true}); }catch(e){ return ""; }
}

function renderLobby(){
  const other = 1-N.me, link = liveLink();
  h(`${header()}
  <div class="card" style="display:flex;flex-direction:column;gap:14px;text-align:center">
    <div class="eyebrow">Two phones</div>
    <h2 style="font-size:26px">${esc(nameOf(other))}, scan this</h2>
    <div class="qrbox">${qrSvg(link)}</div>
    <div class="linkbox" id="lk">${esc(link)}</div>
    <div class="row"><button class="btn ghost" id="copy">Copy link</button>${navigator.share?`<button class="btn ghost" id="share">Send link</button>`:""}</div>
    <div><label style="margin-bottom:8px">This phone is</label>
      <div class="seg">${[0,1].map(p=>`<button class="vibe" data-p="${p}" aria-pressed="${N.me===p}">${esc(nameOf(p))}</button>`).join("")}</div></div>
    <button class="btn" id="go">Start</button>
    <div class="small">The game starts by itself when ${esc(nameOf(other))} joins.</div>
  </div>
  <div class="foot"><button class="linkish" id="leave">Back</button></div>`);
  document.getElementById("copy").onclick = async (e)=>{
    try{ await navigator.clipboard.writeText(link); e.target.textContent = "Copied"; }
    catch(err){ const r = document.createRange(); r.selectNodeContents(document.getElementById("lk")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  };
  const sh = document.getElementById("share");
  if(sh) sh.onclick = ()=>navigator.share({title:"GG love game", text:"Play with me ♥", url:link}).catch(()=>{});
  document.querySelector(".seg").onclick = e=>{ const p = e.target.dataset.p; if(p===undefined || +p===N.me) return; setMe(+p); render(); };
  document.getElementById("go").onclick = ()=>{ S.screen = "live"; onLive(); };
  document.getElementById("leave").onclick = leaveLive;
}

function renderJoinWait(){
  const slow = N && (N.failed || Date.now()-N.t0 > 12000);
  h(`${header()}<div class="curtain">
    <div class="eyebrow">GG love game</div>
    <div class="big" style="font-size:34px">${slow?"Can't find this game":"Joining<span class=\"typing\"></span>"}</div>
    <p class="hint">${slow?"Check the internet connection, or ask for a new QR code.":"Connecting to your partner's phone."}</p>
    ${slow?`<button class="btn" id="retry">Try again</button><button class="linkish" id="solo">Play on one phone instead</button>`:""}
  </div>`);
  if(slow){
    document.getElementById("retry").onclick = ()=>location.reload();
    document.getElementById("solo").onclick = leaveLive;
  } else setTimeout(()=>{ if(S.screen==="joinwait") render(); }, 12500);
}

function renderJoinHello(){
  const G = N.game, me = 1-G.host;
  h(`${header()}<div class="curtain">
    <div class="eyebrow">A little surprise for</div>
    <div class="big">${esc(nameOf(me))}</div>
    <p style="font-size:18px;max-width:30ch;margin:0">${esc(nameOf(G.host))} made you a game. Answer on your phone, and see if you two match.</p>
    <button class="btn" id="go">Let's play ♥</button>
    <button class="linkish" id="other">I'm ${esc(nameOf(G.host))}</button>
  </div>`);
  const join = p=>{ setMe(p); S.screen = "live"; onLive(); hearts(10); };
  document.getElementById("go").onclick = ()=>join(me);
  document.getElementById("other").onclick = ()=>join(G.host);
}

function renderLive(){
  const G = N.game;
  if(!G){ h(`${header()}<div class="curtain"><div class="big" style="font-size:30px">Loading<span class="typing"></span></div></div>`); return; }
  const i = G.i, q = Q[G.deck[i]], fp = firstP(i), other = 1-N.me;
  const mine = pickOf(N.me), theirs = pickOf(other);
  const reveal = mine!==null && theirs!==null;
  const pA = pickOf(fp), pB = pickOf(1-fp), match = reveal && pA===pB;
  const key = G.g+":"+i;
  if(reveal && match && N.hearted!==key){ N.hearted = key; hearts(14); }
  if(reveal && N.autoKey!==key){
    N.autoKey = key; N.auto = kittyStart(); const g = G.g; showKitty();
    setTimeout(()=>{ // both phones do this; the same next state is written twice, which is harmless
      const cur = N && N.game; if(!cur || cur.g!==g || cur.i!==i) return;
      pubGame({...cur, i:i+1, matches:cur.matches+(match?1:0), done:cur.done+1}); window.scrollTo(0,0);
    }, BREAK_MS);
  }
  let status = "";
  if(!reveal){
    if(mine===null) status = theirs!==null ? `<b>${esc(nameOf(other))}</b> has answered ✓ · your turn` : `Both pick now · <b>${esc(nameOf(other))}</b> is thinking<span class="typing"></span>`;
    else status = `Locked in ✓ · waiting for <b>${esc(nameOf(other))}</b><span class="typing"></span>`;
  }
  h(`${header()}
  <div class="card">
    <span class="chip">${VIBES[q.c]||"Bonus"}</span>
    <div class="q">${esc(fill(q.q, i))}</div>
    <p class="hint">${esc(hint(q, i))}</p>
  </div>
  <div class="answers" id="ans">${q.a.map((t,k)=>{
     const ca = reveal ? pA===k : mine===k && N.me===fp, cb = reveal ? pB===k : mine===k && N.me!==fp;
     return `<button class="ans ${ca?"pick-a":""} ${cb?"pick-b":""}" data-k="${k}" ${mine!==null?'tabindex="-1"':""}>
       <span class="k">${"ABCD"[k]}</span><span>${esc(fill(t, i))}</span>
       ${(ca||cb)?`<span class="who">${ca?`<span class="dot a">${esc(reveal?nameOf(fp):"You")}</span>`:""}${cb?`<span class="dot b">${esc(reveal?nameOf(1-fp):"You")}</span>`:""}</span>`:""}
     </button>`;}).join("")}</div>
  ${reveal?`<div class="result ${match?"match":"miss"}"><div class="big">${match?"In sync! ♥":"Oops, not this time"}</div>
     <p class="hint">${match? (q.t==="a"?`${esc(nameOf(1-fp))} knows ${esc(nameOf(fp))} well.`:"Same wavelength.") : (q.t==="a"?`${esc(nameOf(fp))}, tell ${esc(nameOf(1-fp))} why!`:"Talk it out. Who's right?")}</p></div>
     ${kittyHTML(N.auto, i+1<G.deck.length?"Next question coming…":"Your score is coming…")}`
   : `<div class="status">${status}</div>`}
  <div class="foot"><button class="linkish" id="leave">Leave game</button></div>`);
  if(mine===null){
    document.getElementById("ans").onclick = e=>{
      const b = e.target.closest(".ans"); if(!b) return;
      N.picks[N.me] = {g:G.g, i, k:+b.dataset.k}; pub("pick/"+N.me, N.picks[N.me]); onLive();
    };
  }
  document.getElementById("leave").onclick = leaveLive;
}

function renderLiveEnd(){
  const G = N.game, n = G.done, p = n ? Math.round(G.matches/n*100) : 0, [t,sub] = verdict(p);
  h(`${header()}
  <div class="card final">
    <div class="eyebrow">${esc(S.a)} &amp; ${esc(S.b)} are</div>
    <div class="meter">${p}%</div>
    <div class="bar"><i style="width:${p}%"></i></div>
    <h2 style="font-size:30px;color:var(--cherry)">${t}</h2>
    <p class="hint" style="font-size:16px">${sub} ${G.matches} of ${n} answers matched.</p>
    <div class="row" style="width:100%"><button class="btn" id="again">New game</button><button class="btn ghost" id="leave">Leave</button></div>
  </div>`);
  if(N.hearted!==G.g+":end" && p>=45){ N.hearted = G.g+":end"; hearts(24); }
  document.getElementById("again").onclick = ()=>{ S.vibes = G.vibes||S.vibes; S.rounds = G.rounds??S.rounds; pubGame({...G, picking:N.me}); window.scrollTo(0,0); };
  document.getElementById("leave").onclick = leaveLive;
}

function boot(){
  const room = new URLSearchParams(location.search).get("room");
  if(room && /^[a-z0-9]{4,12}$/.test(room)){
    let me = null; try{ const v = localStorage.getItem(roomKey(room)); if(v==="0"||v==="1") me = +v; }catch(e){}
    connect(room, me);
    S.screen = me===null ? "joinwait" : "live";
  }
  render();
}
boot();
</script>

</body>
</html>
